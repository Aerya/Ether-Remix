<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 128" width="840" height="128" role="img" aria-label="Ether Remix" class="ether-logo" data-motion="animated" style="--ink:#f0f0e9;--accent:#52dfc5">
<title>Ether Remix</title><desc>Continuum: a continuous current folded into an e.</desc>
<style>

 .ether-trace{stroke-dasharray:1;stroke-dashoffset:0}
 [data-motion=animated] .ether-trace{animation:ether-draw .8s cubic-bezier(.22,.68,.16,1) var(--delay,0s) backwards}
 [data-motion=animated] .ether-signal{animation:ether-draw .8s cubic-bezier(.22,.68,.16,1) var(--delay,0s) backwards,ether-breathe 5s ease-in-out 2s infinite}
 @keyframes ether-draw{from{stroke-dashoffset:1}}
 @keyframes ether-breathe{0%,20%,70%,100%{opacity:1}45%{opacity:.5}}
 @media(prefers-reduced-motion:reduce){.ether-trace,.ether-signal{animation:none!important}}
 .remix-separator{stroke-dasharray:1;stroke-dashoffset:0;animation:remix-line .38s ease-out 1.05s backwards}
 .remix-letters{animation:remix-reveal .55s cubic-bezier(.2,.7,.2,1) 1.18s both}
 @keyframes remix-line{from{stroke-dashoffset:1}}
 @keyframes remix-reveal{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}
 @media(prefers-reduced-motion:reduce){.remix-separator,.remix-letters{animation:none!important}}
</style>

