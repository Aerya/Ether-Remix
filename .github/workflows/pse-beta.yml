# Branche expérimentale uniquement. Ne publie jamais latest.
name: Ether-Remix · Image BETA

on:
  push:
    branches: [BETA]
    paths-ignore: ["**.md", "docs/**", "release-notes/**", ".github/**"]
  workflow_dispatch:

concurrency:
  group: pse-docker-beta
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.ref == 'refs/heads/BETA'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Version
        id: v
        run: |
          # L'historique public est indépendant de celui d'Ether.
          base=$(python3 -c 'import json; print(json.load(open("web/package.json"))["version"])')
          echo "version=$base-beta.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          echo "ffmpeg=linux-amd64 linux-arm64" >> "$GITHUB_OUTPUT"

      - name: FFmpeg épinglé
        run: scripts/fetch-ffmpeg.sh ${{ steps.v.outputs.ffmpeg }}

      # Le binaire Go est compilé nativement pour chaque architecture
      # (FROM --platform=$BUILDPLATFORM) ; QEMU ne sert qu'à l'étape apt arm64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        env:
          ETHER_TMDB_BUNDLED_KEY: ${{ secrets.ETHER_TMDB_BUNDLED_KEY }}
        run: |
          img=ghcr.io/remix-media/ether-remix
          tags="-t $img:beta -t $img:${{ steps.v.outputs.version }} -t $img:beta-sha-${{ steps.v.outputs.commit }}"
          docker buildx build \
            --platform "${{ steps.v.outputs.platforms }}" \
            --build-arg VERSION="${{ steps.v.outputs.version }}" \
            --build-arg COMMIT="${{ steps.v.outputs.commit }}" \
            --secret id=ETHER_TMDB_BUNDLED_KEY \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.title="Ether-Remix" \
            --label org.opencontainers.image.description="Ether en VF, avec la musique" \
            --label org.opencontainers.image.version="${{ steps.v.outputs.version }}" \
            --cache-from type=gha --cache-to type=gha,mode=max \
            $tags \
            --push .
          echo "Image : $img:${{ steps.v.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
