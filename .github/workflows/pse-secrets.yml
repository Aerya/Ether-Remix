name: Ether-Remix · Secrets

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pse-secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Installer Gitleaks vérifié
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Examiner uniquement les nouveaux commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-$(git rev-parse origin/main)}"
          git cat-file -e "$base^{commit}"
          base=$(git merge-base "$base" HEAD)
          # Ignore any scan configuration/allowlist supplied by the PR.
          config="$RUNNER_TEMP/gitleaks-trusted.toml"
          # Restrict false positives to generated translation IDs and reviewed
          # public/test literals. All other values keep the default rules.
          cat > "$config" <<'TOML'
          [extend]
          useDefault = true
          [[rules]]
          id = "generic-api-key"
          [[rules.allowlists]]
          condition = "AND"
          paths = ['''^web/src/i18n/locales/[^/]+\.json$''']
          regexTarget = "secret"
          regexes = ['''^m_[a-f0-9]{14}$''']
          [[rules.allowlists]]
          condition = "AND"
          paths = ['''^internal/frontend/xtream\.go$''']
          regexTarget = "secret"
          regexes = ['''^abcdefghjkmnpqrstuvwxyz23456789$''']
          [[rules.allowlists]]
          condition = "AND"
          paths = ['''^internal/.*_test\.go$''']
          regexTarget = "secret"
          regexes = ['''^(5d7768263c3c2a001fbcb0b0|5d7768253c3c2a001fbcace5|5d7768684de0ee001fcd359a|signed-col-10|SECRET_PASSKEY_123|rotated\+key/2026|tmdb-person-99)$''']
          [[rules.allowlists]]
          # Public Nuvio (Supabase) publishable key, the same one shipped in the Nuvio app.
          condition = "AND"
          paths = ['''^internal/pse/nuvio/anon\.go$''']
          regexTarget = "secret"
          regexes = ['''^sb_publishable_[A-Za-z0-9_-]+$''']
          TOML
          touch "$RUNNER_TEMP/gitleaks-empty-ignore"
          # Never publish the scanner's output, even on an internal error.
          if ! "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --no-banner --redact=100 \
            --config "$config" --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-empty-ignore" \
            --ignore-gitleaks-allow --log-opts="$base..HEAD" \
            > "$RUNNER_TEMP/gitleaks-scan.log" 2>&1; then
            echo "::error::Secret potentiel détecté ou analyse impossible. Corriger la PR ; aucune valeur secrète publiée."
            exit 1
          fi
          echo 'Aucun nouveau secret reconnu par Gitleaks.'
