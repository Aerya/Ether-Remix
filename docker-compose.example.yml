# Ether-Remix — à copier dans compose.yaml (ou à coller dans Dockge-Enhanced).
# Console : http://ADRESSE_DU_SERVEUR:32400/ether/
# Pour MediaFlow + Gluetun : voir docs/alldebrid-mediaflow.md et
# docker-compose.mediaflow-gluetun.yml, puis ajouter le réseau media à ce service.
services:
  remix:
    image: ghcr.io/aerya/ether-remix:latest
    container_name: ether-remix
    restart: unless-stopped
    ports:
      - "32400:32400"
    environment:
      TZ: Europe/Paris
    volumes:
      - ./config:/config
      - ./cache:/cache
      # Source locale facultative (adaptez le chemin hôte) :
      # - /chemin/vers/medias:/media:ro
    # Accélération Intel/AMD facultative :
    # devices:
    #   - /dev/dri:/dev/dri
    # NVIDIA NVENC facultatif (nécessite nvidia-container-toolkit) :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
# Si Plex utilise déjà le port 32400, changez seulement le port hôte :
# "32800:32400". La console sera alors accessible sur le port 32800.
# Le mode bridge ne fournit pas la découverte Plex GDM du réseau hôte.
# Pour celle-ci, remplacez ports par network_mode: host ; ce mode ne permet
# pas de joindre MediaFlow par son nom Docker. Le guide utilise le mode bridge.
# Jellyfin, Emby et Silo utilisent le port de la console, pas le port 8096.
