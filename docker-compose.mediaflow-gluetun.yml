# MediaFlow + Gluetun — stack séparée pour Ether-Remix.
# Prérequis : réseau Docker media, wg0.conf et MEDIAFLOW_API_PASSWORD dans .env.
# Installation et raccordement : docs/alldebrid-mediaflow.md
services:
  gluetun:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun:/dev/net/tun]
    volumes:
      - ./wg0.conf:/gluetun/wireguard/wg0.conf:ro
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      HTTPPROXY: "on"
      HTTPPROXY_LOG: "off"
      FIREWALL_INPUT_PORTS: "8888,8889"
    networks: [media]
  mediaflow:
    image: mhdzumair/mediaflow-proxy:latest
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      API_PASSWORD: ${MEDIAFLOW_API_PASSWORD:?Définissez un mot de passe}
      PORT: "8889"
      GUNICORN_ACCESS_LOGFILE: /dev/null
      LOG_LEVEL: WARNING
networks:
  media:
    external: true
    name: media
